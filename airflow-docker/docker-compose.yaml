# 20250709_001 - PoChun Hsu - [Drop]    Drop PIP_ADDITIONAL_REQUIREMENTS. Change to use pip install from requirement.txt.
# 20250709_002 - PoChun Hsu - [Add]     Add redis
# 20250728_001 - PoChun Hsu - [Add]     Add Spark
# 20250729_001 - PoChun Hsu - [Add]     Add Jupyter Notebook
# 20250906_001 - PoChun Hsu - [Drop]    Version which is not needed.
# 20250906_002 - PoChun Hsu - [Drop]    Jupyter Notebook which is not needed.
# 20250906_003 - PoChun Hsu - [Alter]   Airflow version to 2.11.0. The latest version of 2.x
# 20250906_004 - PoChun Hsu - [Add]     Airflow install into Dockerfile.airflow
# 20250906_003 - PoChun Hsu - [Add]     Spark install into Dockerfile.spark
# 20250906_004 - PoChun Hsu - [Drop]    requirements. Add to Dockerfile.
# 20250906_005 - PoChun Hsu - [Drop]    jar-downloader. Add to Dockerfile.
# 20250908_001 - PoChun Hsu - [Add]     Spark volume: event
# 20250908_002 - PoChun Hsu - [Add]     Spark-History
# 20250920_001 - PoChun Hsu - [Drop]    platform setting of Metabase. Make sure it works in M1 Mac.
# 20250926_001 - PoChun Hsu - [Alter]   Improved build efficiency by reusing pre-downloaded spark.tgz.
# 20250928_001 - PoChun Hsu - [Add]     Enabled Airflow to trigger jobs via Docker socket, delegating actual execution to Spark.
# 20251016_001 - PoChun Hsu - [Add]     Docker builder for Airflow and Spark. Replace build in each service.
# 20251016_002 - PoChun Hsu - [Alter]   hashtag Metabase for VM.
# 20251016_003 - PoChun Hsu - [Add]     airflow initial scripts and related settings.
# 20251016_004 - PoChun Hsu - [Add]     GCP crednetial json to Services.
# 20251016_005 - PoChun Hsu - [Alter]   Spark to use package in local rather than download. Decrease the time of building.
# 20251016_006 - PoChun Hsu - [Alter]   Check health status of Postgres before Airflow

# version: '3.8' # 20250906_001

x-airflow-common:
  &airflow-common
  image: local/airflow:2.11.0-pc1 # 20250906_003 #20250906_004
  # 20251016_001
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # 20250709_001 
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # 20250709_001 #20250906_004
  user: "${AIRFLOW_UID}:0"
  depends_on:
    - postgres
    - redis

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    # 20251016_006 >>
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 20251016_006 <<
  # 20250709_002 >>
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"

  # 20250709_002 <<

  # 20250906_005 >>
  # 20250729_002 >>
  # 20250729_002 <<
  # 20250906_005 <<

  # 20250728_001 >>
  spark:
    container_name: spark
    # 20250906_005 >>
    image: local/spark:3.5.0
    # 20251016_001
    # 20250906_005 <<
    command: ["/bin/bash","-lc","/opt/spark/sbin/start-master.sh"]
    environment:
      - SPARK_MODE=master                   # 必須是 master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_DIRS=/tmp
      - SPARK_HOME=/opt/spark               # 20251016_005
      - SPARK_NO_DAEMONIZE=true             # 20251016_005
    ports:
      - "8088:8080"   # Spark Master UI
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./spark_app:/opt/spark-apps
      - ./output_parquet:/opt/spark-output         # 20250901_001 ✅ 新增：共享輸出
      # - ./spark_jars:/opt/spark/jars             # 20250901_001 可選：確保 jar 一致
      - ./spark-events:/tmp/spark-events           # 20250908_001
      - ./spark_conf:/opt/spark/conf               # 20250910_001 # 20251016_005
      - ./spark_jars:/opt/spark/external-jars:ro   # 20251016_005
    # 20250910_002 >>
    deploy:
      resources:
        limits:
          memory: 3G   # 給 master 足夠的頭部空間
    # 20250910_002 <<

  spark-worker:
    # 20250906_005 >>
    image: local/spark:3.5.0
    # 20251016_001
    # 20250906_005 <<
    command: ["/bin/bash","-lc","/opt/spark/sbin/start-worker.sh spark://spark:7077"] # 20251016_005
    environment:
      - SPARK_MODE=worker        # ✅ Worker 模式
      - SPARK_WORKER_MEMORY=4G   # 20250910_002 bitnami 變數，限制 executor 總額
      - SPARK_NO_DAEMONIZE=true  # 20251016_005
      - SPARK_HOME=/opt/spark    # 20251016_005
    volumes:
      - ./output_parquet:/opt/spark-output         # 20250901_001 ✅ 新增：共享輸出（必要）
      # - ./spark_jars:/opt/spark/jars             # 20250901_001 可選
      - ./spark_conf:/opt/spark/conf               # 20250910_001 # 20251016_005
      - ./spark_jars:/opt/spark/external-jars:ro   # 20251016_005
    # 20250906_005
    depends_on:
      - spark
    # 20250910_002 >>
    deploy:
      resources:
        limits:
          memory: 4G
    # 20250910_002 <<
  # 20250728_001 <<
  
  # 20250908_002 >>
  spark-history:
    image: local/spark:3.5.0                                               # 20251016_005
    command: ["/bin/bash","-lc","/opt/spark/sbin/start-history-server.sh"] # 20251016_005
    environment:
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:/tmp/spark-events
      - SPARK_HOME=/opt/spark  # 20251016_005
    ports:
      - "18080:18080"
    volumes:
      - ./spark-events:/tmp/spark-events:ro
  # 20250908_002 <<

  # 20250906_002 >>
  # 20250729_001 >>
  # 20250729_001 <<
  # 20250906_002 <<

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # 20250928_001 >>
    user: "0:0"   # 建議用 root 免去 macOS 上 docker.sock 權限問題
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    # 20250928_001 <<
      - ./keys:/opt/airflow/keys:ro     # 20251016_004 若腳本要用到 GCP SA

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    # 20250928_001 >>
    user: "0:0"   # 建議用 root 免去 macOS 上 docker.sock 權限問題
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    # 20250928_001 <<
      - ./keys:/opt/airflow/keys:ro     # 若腳本要用到 GCP SA

  # 20251016_001 Airflow builder service to avoid parallel export conflicts.
  airflow-builder:
    image: local/airflow:2.11.0-pc1     # 與執行用服務相同 tag
    build:
      context: .                        # 20250925_001
      dockerfile: ./airflow/Dockerfile  # 20250925_001
    profiles: ["builder"]               # 僅 build，用 profile 隔離
    volumes:
      - ./keys:/opt/airflow/keys:ro     # 若腳本要用到 GCP SA
  
  # 20251016_001 Spark builder service to avoid parallel export conflicts.
  spark-builder:
    image: local/spark:3.5.0            # 與執行用服務相同 tag
    build:
      context: .                        # 20250925_001
      dockerfile: ./spark/Dockerfile    # 20250925_001
    profiles: ["builder"]               # 僅 build，用 profile 隔離

  airflow-init:
    <<: *airflow-common
    # 20250709_001
    # 20250906_004
    # 20251016_003 >>
    entrypoint: ["/bin/bash","-lc"]
    command: ["/opt/airflow/scripts/airflow-init.sh"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts:ro   # 放 init 腳本（唯讀）
      - ./keys:/opt/airflow/keys:ro         # 若腳本要用到 GCP SA
    environment:
      GCP_KEY_PATH: /opt/airflow/keys/starry-center-405211-04dd3e1fa083.json
      GCP_PROJECT: starry-center-405211
      GCP_SCOPE: https://www.googleapis.com/auth/spreadsheets,https://www.googleapis.com/auth/drive
    depends_on:
      postgres:
        condition: service_started           # 建議再搭配 db 健康檢查（見下）
    # 20251016_003 <<
        
  # 20251016_002 >>
  # metabase:
  #   image: metabase/metabase:latest
  #   # platform: linux/amd64 20250920_001
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     MB_DB_FILE: /metabase-data/metabase.db
  #   volumes:
  #     - metabase-data:/metabase-data
  #   depends_on:
  #     - postgres
  # 20251016_002 <<

volumes:
  postgres-db-volume:
  metabase-data:
