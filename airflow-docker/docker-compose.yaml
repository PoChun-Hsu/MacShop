# 20250906_003 - PoChun Hsu - [Alter]   Airflow version to 2.11.0. The latest version of 2.x
# 20250906_004 - PoChun Hsu - [Add]     Airflow install into Dockerfile.airflow
# 20250906_003 - PoChun Hsu - [Add]     Sparkinstall into Dockerfile.spark

# version: '3.8' # 20250906_001

x-airflow-common:
  &airflow-common
  image: local/airflow:2.11.0-pc1 # 20250906_003 #20250906_004
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    #_PIP_ADDITIONAL_REQUIREMENTS: "beautifulsoup4 requests asyncpg aiohttp redis" # 20250709_001 
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # - ./requirements.txt:/requirements.txt # 20250709_001 #20250906_004
  user: "${AIRFLOW_UID}:0"
  depends_on:
    - postgres
    - redis

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
  # 20250709_002 >>
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"

  # 20250709_002 <<

  # 20250906_005 >>
  # 20250729_002 >>
  # jar-downloader:
  #   image: curlimages/curl
  #   command: >
  #     sh -c "mkdir -p /downloads &&
  #            curl -L -o /downloads/postgresql-42.7.3.jar https://jdbc.postgresql.org/download/postgresql-42.7.3.jar"
  #   volumes:
  #     - ./spark_jars:/downloads
  # 20250729_002 <<
  # 20250906_005 <<

  # 20250728_001 >>
  spark:
    container_name: spark
    # 20250906_005 >>
    image: local/spark:3.5.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    # 20250906_005 <<
    command: /opt/bitnami/spark/sbin/start-master.sh
    environment:
      - SPARK_MODE=master   # 必須是 master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_DIRS=/tmp
    ports:
      - "8088:8080"   # Spark Master UI
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./spark_app:/opt/spark-apps
      # - ./spark_jars:/opt/spark/jars # 20250906_005


  spark-worker:
    # 20250906_005 >>
    image: local/spark:3.5.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    # 20250906_005 <<
    command: /opt/bitnami/spark/sbin/start-worker.sh spark://spark:7077
    environment:
      - SPARK_MODE=worker   # ✅ Worker 模式
    # volumes:
    #   - ./spark_jars:/opt/spark/jars # 20250906_005
    depends_on:
      - spark
  # 20250728_001 <<

  # 20250906_002 >>
  # 20250729_001 >>
  # 20250729_001 <<
  # 20250906_002 <<

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-worker:
    <<: *airflow-common
    command: celery worker

  airflow-init:
    <<: *airflow-common
    # 20250709_001
    # 20250906_004
    command: bash -c "airflow db migrate && airflow users create \
      --username admin \
      --firstname Admin \
      --lastname User \
      --role Admin \
      --email admin@example.com \
      --password admin&&
      airflow connections add 'postgres_default' \
        --conn-uri 'postgresql+psycopg2://airflow:airflow@postgres:5432/airflow'"

  metabase:
    image: metabase/metabase:latest
    platform: linux/amd64 
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - postgres

volumes:
  postgres-db-volume:
  metabase-data:
