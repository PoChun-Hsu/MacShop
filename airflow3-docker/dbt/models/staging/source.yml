# 20260314_002 - PoChun Hsu - [Add]     Data Freshness check.
# 20260320_001 - PoChun Hsu - [Alter]   Use macros, null_ratio 

version: 2

sources:
  - name: raw
    schema: public
    tables:
      - name: ptt_macshop_articles_product_detail
        # 20260320_001 >>
        tests:
          - dbt_utils.expression_is_true:
              expression: "{{ null_ratio(source('raw','ptt_macshop_articles_product_detail'), 'created_date') }} < 0.05"

          - dbt_utils.expression_is_true:
              expression: "{{ null_ratio(source('raw','ptt_macshop_articles_product_detail'), 'product_type') }} < 0.15"

          - dbt_utils.expression_is_true:
              expression: "{{ null_ratio(source('raw','ptt_macshop_articles_product_detail'), 'price') }} < 0.5"
        # 20260320_001 <<
        columns:
          - name: created_date
          - name: product_type
          - name: price

# 20260314_002 >>
  - name: macshop_dw
    schema: public
    tables:
      - name: ptt_macshop_articles_product_detail
        loaded_at_field: created_date

        freshness:
          warn_after: {count: 60, period: minute}
          error_after: {count: 3, period: hour}
