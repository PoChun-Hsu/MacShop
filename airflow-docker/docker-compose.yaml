# 20250709_001 - PoChun Hsu - [Drop]    Drop PIP_ADDITIONAL_REQUIREMENTS. Change to use pip install from requirement.txt.
# 20250709_002 - PoChun Hsu - [Add]     Add redis
# 20250728_001 - PoChun Hsu - [Add]     Add Spark
# 20250729_001 - PoChun Hsu - [Add]     Add Jupyter Notebook
# 20250906_001 - PoChun Hsu - [Drop]    Version which is not needed.
# 20250906_002 - PoChun Hsu - [Drop]    Jupyter Notebook which is not needed.
# 20250906_003 - PoChun Hsu - [Alter]   Airflow version to 2.11.0. The latest version of 2.x
# 20250906_004 - PoChun Hsu - [Add]     Airflow install into Dockerfile.airflow
# 20250906_003 - PoChun Hsu - [Add]     Spark install into Dockerfile.spark
# 20250906_004 - PoChun Hsu - [Drop]    requirements. Add to Dockerfile.
# 20250906_005 - PoChun Hsu - [Drop]    jar-downloader. Add to Dockerfile.
# 20250908_001 - PoChun Hsu - [Add]     Spark volume: event
# 20250908_002 - PoChun Hsu - [Add]     Spark-History
# 20250920_001 - PoChun Hsu - [Drop]    platform setting of Metabase. Make sure it works in M1 Mac.
# 20250926_001 - PoChun Hsu - [Alter]   Improved build efficiency by reusing pre-downloaded spark.tgz.
# 20250928_001 - PoChun Hsu - [Add]     Enabled Airflow to trigger jobs via Docker socket, delegating actual execution to Spark.

# version: '3.8' # 20250906_001

x-airflow-common:
  &airflow-common
  image: local/airflow:2.11.0-pc1 # 20250906_003 #20250906_004
  build:
    context: .                       # 20250925_001
    dockerfile: ./airflow/Dockerfile # 20250925_001
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    #_PIP_ADDITIONAL_REQUIREMENTS: "beautifulsoup4 requests asyncpg aiohttp redis" # 20250709_001 
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # - ./requirements.txt:/requirements.txt # 20250709_001 #20250906_004
  user: "${AIRFLOW_UID}:0"
  depends_on:
    - postgres
    - redis

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
  # 20250709_002 >>
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"

  # 20250709_002 <<

  # 20250906_005 >>
  # 20250729_002 >>
  # 20250729_002 <<
  # 20250906_005 <<

  # 20250728_001 >>
  spark:
    container_name: spark
    # 20250906_005 >>
    image: local/spark:3.5.0
    build:
      context: .                     # 20250925_001
      dockerfile: ./spark/Dockerfile # 20250925_001
    # 20250906_005 <<
    command: /opt/bitnami/spark/sbin/start-master.sh
    environment:
      - SPARK_MODE=master   # 必須是 master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_DIRS=/tmp
    ports:
      - "8088:8080"   # Spark Master UI
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./spark_app:/opt/spark-apps
      - ./output_parquet:/opt/spark-output         # 20250901_001 ✅ 新增：共享輸出
      - ./spark_jars:/opt/spark/jars               # 20250901_001 可選：確保 jar 一致
      - ./spark-events:/tmp/spark-events           # 20250908_001
      - ./spark_conf:/opt/bitnami/spark/conf       # 20250910_001
    # 20250910_002 >>
    deploy:
      resources:
        limits:
          memory: 3G   # 給 master 足夠的頭部空間
    # 20250910_002 <<

  spark-worker:
    # 20250906_005 >>
    image: local/spark:3.5.0
    build:
      context: .                     # 20250925_001
      dockerfile: ./spark/Dockerfile # 20250925_001
    # 20250906_005 <<
    command: /opt/bitnami/spark/sbin/start-worker.sh spark://spark:7077
    environment:
      - SPARK_MODE=worker        # ✅ Worker 模式
      - SPARK_WORKER_MEMORY=4G   # 20250910_002 bitnami 變數，限制 executor 總額
    volumes:
      - ./output_parquet:/opt/spark-output         # 20250901_001 ✅ 新增：共享輸出（必要）
      - ./spark_jars:/opt/spark/jars               # 20250901_001 可選
      - ./spark_conf:/opt/bitnami/spark/conf       # 20250910_001
    # 20250906_005
    depends_on:
      - spark
    # 20250910_002 >>
    deploy:
      resources:
        limits:
          memory: 4G
    # 20250910_002 <<
  # 20250728_001 <<
  
  # 20250908_002 >>
  spark-history:
    image: bitnami/spark:3.5
    command: ["spark-history-server"]
    environment:
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:/tmp/spark-events
    ports:
      - "18080:18080"
    volumes:
      - ./spark-events:/tmp/spark-events:ro
  # 20250908_002 <<

  # 20250906_002 >>
  # 20250729_001 >>
  # 20250729_001 <<
  # 20250906_002 <<

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # 20250928_001 >>
    user: "0:0"   # 建議用 root 免去 macOS 上 docker.sock 權限問題
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    # 20250928_001 <<

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    # 20250928_001 >>
    user: "0:0"   # 建議用 root 免去 macOS 上 docker.sock 權限問題
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    # 20250928_001 <<

  airflow-init:
    <<: *airflow-common
    # 20250709_001
    # 20250906_004ß
    command: ["/opt/spark/spark-3.5.0-bin-hadoop3/sbin/start-history-server.sh"]

  metabase:
    image: metabase/metabase:latest
    # platform: linux/amd64 20250920_001
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - postgres

volumes:
  postgres-db-volume:
  metabase-data:
