spark.dynamicAllocation.enabled false

spark.executor.instances 1
spark.executor.cores 1
spark.executor.memory 1g
spark.executor.memoryOverhead 384m

spark.driver.memory 1g
spark.driver.memoryOverhead 384m

spark.sql.shuffle.partitions 4
spark.default.parallelism 4
spark.sql.adaptive.enabled true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.coalescePartitions.initialPartitionNum 4

spark.network.timeout                 300s
spark.executor.heartbeatInterval      30s
spark.rdd.compress                    true
spark.broadcast.compress              true
spark.serializer                      org.apache.spark.serializer.KryoSerializer
spark.sql.session.timeZone            Asia/Taipei

spark.master                          spark://spark:7077

# 啟用 eventLog（History UI 需要）
spark.eventLog.enabled                true
spark.eventLog.dir                    file:/tmp/spark-events
spark.history.fs.logDirectory         file:/tmp/spark-events

# （可選）若你要掛 external-jars 就加這個；不需要就不要加
# ❌ 你現在已經改成 build-time jars → 不要再用 external-jars
# spark.driver.extraClassPath=/opt/spark/external-jars/*
# spark.executor.extraClassPath=/opt/spark/external-jars/*

# ✅【新增】統一使用 Spark 內建 jars（Docker build 已 COPY 進 /opt/spark/jars）
# 👉 不加這段某些情況會抓不到 Iceberg / S3 / JDBC
spark.driver.extraClassPath           /opt/spark/jars/*
spark.executor.extraClassPath         /opt/spark/jars/*


# 20260330_001 >>
# === Iceberg Catalog 設定 ===
# 定義一個 catalog 名叫 iceberg，使用 SparkCatalog（Iceberg 的入口）
spark.sql.catalog.iceberg             org.apache.iceberg.spark.SparkCatalog
# 指定 catalog 類型為 REST（透過 iceberg-rest 服務管理 metadata）
spark.sql.catalog.iceberg.type        rest
# REST catalog 的服務位置（你 docker 的 iceberg-rest）
spark.sql.catalog.iceberg.uri         http://iceberg-rest:8181
# Iceberg 資料實際存放位置（MinIO / S3 bucket）
spark.sql.catalog.iceberg.warehouse   s3://warehouse/
# 指定底層 IO 實作（用 S3 協定讀寫 Parquet）
spark.sql.catalog.iceberg.io-impl     org.apache.iceberg.aws.s3.S3FileIO
# 啟用 Iceberg SQL extension（必要）
spark.sql.extensions                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
# ⭐ 設定預設 catalog（這樣可以直接用 table 名，不用每次寫 iceberg.xxx）
spark.sql.defaultCatalog              iceberg

# ⭐ Iceberg S3 config（給 Iceberg 用，不是 Hadoop）
spark.sql.catalog.iceberg.s3.endpoint             http://minio:9000
spark.sql.catalog.iceberg.s3.access-key-id        admin
spark.sql.catalog.iceberg.s3.secret-access-key    admin123
spark.sql.catalog.iceberg.s3.path-style-access    true

# ✅【新增】避免 AWS SDK 報 region 錯誤（很常踩雷）
spark.sql.catalog.iceberg.s3.region               us-east-1


# === MinIO（模擬 S3）連線設定 ===
# S3 endpoint（指向 MinIO）
spark.hadoop.fs.s3a.endpoint                      http://minio:9000
# MinIO access key
spark.hadoop.fs.s3a.access.key                    admin
# MinIO secret key
spark.hadoop.fs.s3a.secret.key                    admin123
# 啟用 path-style（MinIO 必要設定）
spark.hadoop.fs.s3a.path.style.access             true
# 認證方式
spark.hadoop.fs.s3a.aws.credentials.provider      org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
# ✅【新增】S3A 必要設定（沒有這個會直接爆）
spark.hadoop.fs.s3a.impl                          org.apache.hadoop.fs.s3a.S3AFileSystem

